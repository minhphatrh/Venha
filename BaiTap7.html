
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 7</title>

    <style>
        * {
            box-sizing: border-box;
        }

        #wrapper {
            width: 220px;
            margin: 40px auto;
            padding: 6px;
            border: 3px solid black;
            position: relative;
        }

        #wrapper::before {
            content: "wrapper";
            position: absolute;
            top: -25px;
            left: 0;
            font-size: 16px;
        }

        header {
            height: 43px;
            border: 2px solid black;
            margin-bottom: 6px;
            padding: 7px;
        }

        nav {
            float: left;
            width: 22%;
            height: 188px;
            border: 2px solid black;
            padding: 5px;
        }

        main {
            float: right;
            width: 75%;
            height: 188px;
            border: 2px solid black;
            padding: 5px;
        }

        footer {
            clear: both;
            height: 35px;
            border: 2px solid black;
            margin-top: 6px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
