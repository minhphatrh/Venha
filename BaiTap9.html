
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - Font Awesome</title>

    <!-- Kết nối thư viện Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
            margin-top: 40px;
        }

        .icon-list {
            width: 600px;
            max-width: 90%;
            margin: 30px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        .icon-item {
            display: inline-block;
            width: 100px;
            margin: 15px;
            padding: 15px 5px;
            color: #333;
        }

        .icon-item i {
            font-size: 35px;
            color: #2878d0;
            margin-bottom: 10px;
        }

        .icon-item p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Font Awesome Icons</h1>

    <div class="icon-list">

        <div class="icon-item">
            <i class="fa-solid fa-house"></i>
            <p>Home</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-user"></i>
            <p>User</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-envelope"></i>
            <p>Email</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-phone"></i>
            <p>Phone</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-camera"></i>
            <p>Camera</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-heart"></i>
            <p>Heart</p>
        </div>

        <div class="icon-item">
            <i class="fa-solid fa-star"></i>
            <p>Star</p>
        </div>

        <div class="icon-item">
            <i class="fa-brands fa-facebook"></i>
            <p>Facebook</p>
        </div>

        <div class="icon-item">
            <i class="fa-brands fa-github"></i>
            <p>GitHub</p>
        </div>

    </div>

</body>
</html>
