<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bat Family</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="root">

        <h1 id="site-header">
            <img src="images/logo.png" alt="Logo">
            <span>The Bat Family</span>
        </h1>

        <ul class="superheroes">

            <li>
                <strong class="hero-header">Batman</strong>
                <img src="images/superhero-1.jpg" alt="Batman">
                <a href="https://en.wikipedia.org/wiki/Batman" target="_blank">Read more</a>
            </li>

            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="images/superhero-2.jpg" alt="Batwing">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)" target="_blank">Read more</a>
            </li>

            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="images/superhero-3.jpg" alt="Batgirl">
                <a href="https://en.wikipedia.org/wiki/Batgirl" target="_blank">Read more</a>
            </li>

            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="images/superhero-4.jpg" alt="Nightwing">
                <a href="https://en.wikipedia.org/wiki/Nightwing" target="_blank">Read more</a>
            </li>

            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="images/superhero-5.jpg" alt="Red Robin">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)" target="_blank">Read more</a>
            </li>

        </ul>

    </div>

</body>
</html>
