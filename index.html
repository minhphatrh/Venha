
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang bài tập CSS - Minh Phát</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f3f7;
            color: #333;
        }

        header {
            background-color: #303d8f;
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        .container {
            width: 900px;
            max-width: 90%;
            margin: 35px auto;
        }

        .profile {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #303d8f;
        }

        .profile h2 {
            color: #303d8f;
        }

        .lessons {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .lessons h2 {
            color: #303d8f;
            text-align: center;
        }

        .lesson-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0;
            list-style: none;
        }

        .lesson-list a {
            display: block;
            padding: 15px;
            background: #f1f3fa;
            color: #303d8f;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .lesson-list a:hover {
            background: #303d8f;
            color: white;
        }

        .social {
            margin-top: 20px;
        }

        .social a {
            display: inline-block;
            margin: 5px;
            padding: 10px 18px;
            background: #303d8f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 600px) {
            .lesson-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>BÀI TẬP CSS</h1>
        <p>Phát triển ứng dụng WEB/TMĐT</p>
    </header>

    <div class="container">

        <section class="profile">
            <img src="images/hinh ca nhan.jpg" alt="Hình ảnh cá nhân">

            <h2>Minh Phát</h2>
            <p>Mã số sinh viên:31241022342</p>
            

            <div class="social">
              
                <a href="https://github.com/minhphatrh" target="_blank">GitHub</a>
                
            </div>
        </section>

        <section class="lessons">
            <h2>Danh sách bài tập đã thực hiện</h2>

            <ul class="lesson-list">
                <li><a href="BaiTap2.html">Bài tập 2</a></li>
                <li><a href="BaiTap4.html">Bài tập 4</a></li>
                <li><a href="BaiTap5.html">Bài tập 5</a></li>
                <li><a href="BaiTap6.html">Bài tập 6</a></li>
                <li><a href="BaiTap7.html">Bài tập 7</a></li>
                <li><a href="BaiTap8.html">Bài tập 8</a></li>
                <li><a href="BaiTap9.html">Bài tập 9</a></li>
            </ul>
        </section>

    </div>

    <footer>
        © 2026 - Minh Phát
    </footer>

</body>
</html>
